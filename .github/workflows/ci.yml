name: ci
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Floats patch releases.
          go-version: "1.26"

      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./...

      # NilAway runs inside custom-gcl, scoped to first party code.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Cache custom-gcl binary
        uses: actions/cache@v6
        with:
          path: custom-gcl
          key: custom-gcl-${{ hashFiles('.custom-gcl.yml') }}

      - name: Build custom-gcl (golangci-lint + NilAway)
        run: |
          if [ ! -x ./custom-gcl ]; then
            golangci-lint custom
          fi

      - name: Run custom-gcl (all linters incl. NilAway)
        run: ./custom-gcl run --timeout=5m ./...
