# Custom golangci-lint binary with NilAway module plugin.
# Built via: golangci-lint custom (produces ./custom-gcl)
# Reference: https://golangci-lint.run/docs/plugins/module-plugins/
# NilAway docs: https://github.com/uber-go/nilaway#golangci-lint--v1570
#
# Version pinning policy:
# - `version` tracks the golangci-lint release used in CI (.github/workflows/ci.yml),
#   which installs it explicitly. The Nix devShell uses floating
#   `pkgs.golangci-lint`, so it may drift from this pin; `custom-gcl` is still
#   built from the pinned version either way.
# - Plugin `version` is the only NilAway pin this project tracks; it is not
#   mirrored in go.mod. Do not use `latest` — reproducible builds only.
version: v2.13.2
plugins:
  - module: "go.uber.org/nilaway"
    import: "go.uber.org/nilaway/cmd/gclplugin"
    version: v0.0.0-20260808063849-8649a03c818a
