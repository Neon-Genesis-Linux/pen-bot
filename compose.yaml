services:
  app:
    build:
      context: .
      # VERSION and COMMIT are baked into the binary via -ldflags in the
      # Dockerfile. Defaults match flake.nix/CI; override from the host, e.g.:
      #   COMMIT=$(git rev-parse HEAD) docker compose build
      args:
        VERSION: ${VERSION:dev}
        COMMIT: ${COMMIT:dev}
    pull_policy: build
    env_file:
      - .env
    volumes:
      - bot_data:/data
    develop:
      watch:
        - action: rebuild
          path: .

volumes:
  bot_data:
