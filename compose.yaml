services:
  app:
    build:
      context: .
      # VERSION and COMMIT are baked into the binary via -ldflags in the
      # Dockerfile. Defaults match flake.nix/CI; override from the host, e.g.:
      #   COMMIT=$(git rev-parse HEAD) docker compose build
      args:
        VERSION: ${VERSION:-0.0.1-alpha}
        COMMIT: ${COMMIT:-dev}
    pull_policy: build
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pen_bot
      POSTGRES_USER: pen_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pen_bot_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
